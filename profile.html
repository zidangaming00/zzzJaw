<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZzzJaw Profile Showcase</title>
  <!-- Import Font Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Loading & Error Overlays */
    .status-overlay {
      background-color: #1a1a1e;
      border: 1px dashed rgba(204, 255, 0, 0.3);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      margin: 20px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(204, 255, 0, 0.2);
      border-top-color: #ccff00;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Navbar Header */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .logo-icon {
      color: #ccff00;
      font-size: 28px;
      font-weight: bold;
    }
    .logo-text {
      color: #ccff00;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }
    .hamburger span {
      width: 24px;
      height: 2px;
      background-color: #ffffff;
      border-radius: 2px;
    }

    /* Sub-header / Actions */
    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .last-updated {
      color: #888888;
      font-size: 13px;
      font-weight: 600;
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-update {
      background-color: #ccff00;
      color: #121212;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .icon-btn {
      background-color: #242424;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccff00;
      cursor: pointer;
      font-size: 16px;
      text-decoration: none;
    }

    /* Profile Card */
    .profile-card {
      background: linear-gradient(135deg, rgba(15, 5, 8, 0.78) 0%, rgba(8, 2, 4, 0.85) 100%), url('https://assetsio.gnwcdn.com/ZZZ-review-header.jpg?width=1600&height=900&fit=crop&quality=100&format=png&enable=upscale&auto=webp');
      background-size: cover;
      background-position: center;
      border-radius: 16px;
      padding: 16px 16px 20px 16px;
      position: relative;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }
    .profile-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      overflow: hidden;
      background-color: #333;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-name {
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.3px;
      word-break: break-word;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }
    .profile-badges-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .server-il-row {
      display: flex;
      gap: 6px;
    }
    .badge-capsule {
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .stat-icon-badges-row {
      display: flex;
      gap: 6px;
      align-items: flex-end;
    }
    .stat-icon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .stat-icon-card img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      margin-bottom: -6px;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .stat-icon-box {
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(4px);
      width: 44px;
      padding: 6px 0 3px 0;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    .profile-tag {
      display: inline-block;
      background-color: rgba(89, 25, 41, 0.85);
      backdrop-filter: blur(4px);
      color: #ff8fa3;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 50px;
      margin-top: 12px;
      border: 1px solid rgba(255, 143, 163, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }
    .section-title-wrapper {
      background-color: #242428;
      border-radius: 0 0 16px 16px;
      padding: 24px 16px 12px 16px;
      position: relative;
      z-index: 2;
      margin-top: -16px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
    }
    .stat-card {
      background-color: #171719;
      border-radius: 0 0 16px 16px;
      padding: 18px 16px 12px 16px;
      position: relative;
      z-index: 1;
      margin-top: -10px;
      margin-bottom: 16px;
    }
    .stat-main-container {
      display: flex;
      align-items: center;
      width: 100%;
    }
    .stat-black-container {
      background-color: #0d0d0e;
      border-radius: 30px;
      display: flex;
      align-items: center;
      padding: 4px 10px 4px 4px;
      gap: 6px;
      flex-shrink: 0;
      z-index: 2;
      height: 60px;
    }
    .sub-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sub-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stat-badge-icon {
      width: 44px;
      height: 44px;
      background-color: #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    .stat-badge-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stat-info {
      background-color: #1e874b;
      flex: 1;
      height: 60px;
      border-top-right-radius: 14px;
      border-bottom-right-radius: 14px;
      margin-left: -30px;
      padding: 6px 14px 6px 36px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      white-space: nowrap;
      color: #ffffff;
      z-index: 1;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 800;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 900;
    }
    .stat-subvalue {
      font-size: 13px;
      font-weight: 800;
    }
    .leaderboard-btn {
      width: 100%;
      background-color: #1f1f22;
      color: #ffffff;
      border: 1px solid #2d2d32;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .filter-box {
      width: 100%;
      background-color: #19191c;
      color: #666666;
      border: 1px solid #2a2a2e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-weight: 500;
    }
    .filter-box select {
      background: transparent;
      color: #ffffff;
      border: none;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      font-weight: 600;
    }
    .table-container {
      background-color: #1c1c1f;
      border-radius: 12px;
      border: 1px solid #2a2a2e;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
    }
    .table-content {
      min-width: 540px;
    }
    .table-header {
      display: grid;
      grid-template-columns: 24px 240px 90px max-content;
      gap: 12px;
      padding: 12px 14px;
      font-size: 14px;
      color: #aaaaaa;
      border-bottom: 1px solid #2a2a2e;
      font-weight: 600;
      align-items: center;
    }
    .table-row {
      display: grid;
      grid-template-columns: 24px 240px 90px max-content;
      gap: 12px;
      padding: 10px 14px;
      align-items: center;
      font-size: 14px;
      border-bottom: 1px solid #242428;
    }
    .table-row:last-child {
      border-bottom: none;
    }
    .row-number {
      color: #aaaaaa;
      font-weight: 500;
      font-size: 13px;
    }
    .player-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .player-mini-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #333;
      overflow: hidden;
      flex-shrink: 0;
    }
    .player-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .level-badge {
      background-color: #242428;
      color: #cccccc;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 6px;
      border-radius: 12px;
      flex-shrink: 0;
    }
    .player-name {
      color: #e5e5e5;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }
    .mindscape-badge {
      width: 40px;
      height: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      justify-self: start;
    }
    .mindscape-0 {
      background-color: #242428;
      color: #ffffff;
    }
    .mindscape-1 {
      background-color: #1e3a52;
      color: #ffffff;
    }
    .crit-ratio-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #e5e5e5;
      font-size: 13px;
      white-space: nowrap;
    }
    .crit-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pagination-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      margin-bottom: 32px;
    }
    .pagination-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .page-btn {
      background-color: #19191c;
      color: #ccff00;
      border: 1px solid #2a2a2e;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-btn:disabled {
      color: #444444;
      border-color: #1f1f22;
      cursor: not-allowed;
    }
    .per-page-select {
      background-color: #19191c;
      color: #ffffff;
      border: 1px solid #2a2a2e;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    .showing-text {
      color: #888888;
      font-size: 12px;
      font-weight: 500;
    }
    .footer {
      text-align: center;
      padding: 24px 0 16px 0;
      border-top: 1px solid #1f1f22;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
    }
    .footer-powered {
      font-size: 13px;
      color: #888888;
      font-weight: 600;
    }
    .footer-powered span {
      color: #ccff00;
      font-weight: 800;
    }
    .footer-subtitle {
      font-size: 12px;
      color: #555555;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <a href="/" class="logo-container">
      <div class="logo-icon">🌐</div>
      <div class="logo-text" id="app-logo">ZzzJaw</div>
    </a>
    <div class="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <!-- Status Overlay (Loading / Error) -->
  <div class="status-overlay" id="status-overlay">
    <div class="spinner" id="status-spinner"></div>
    <span id="status-message" style="font-size: 13px; color: #ccff00; font-weight: 700;">Mengambil data dari Signal Enka...</span>
  </div>

  <!-- Content Section (Hidden until loaded) -->
  <div id="profile-content" style="display: none;">
    <!-- Sub-header -->
    <div class="sub-header">
      <span class="last-updated" id="last-updated">Last updated just now</span>
      <div class="action-buttons">
        <button class="btn-update" id="btn-update">Update</button>
        <a href="/" class="icon-btn">🔍</a>
        <button class="icon-btn">⭐</button>
      </div>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-top">
        <div class="avatar-section">
          <div class="avatar"><img id="profile-avatar" src="" alt="Avatar"></div>
          <div class="profile-name" id="profile-name">-</div>
        </div>
        <div class="profile-badges-container">
          <div class="server-il-row">
            <div class="badge-capsule" id="badge-server">ASIA</div>
            <div class="badge-capsule" id="badge-il">IL 60</div>
          </div>
          <div class="stat-icon-badges-row" id="badge-icons-row"></div>
        </div>
      </div>
      <div class="profile-tag" id="profile-tag">UID: -</div>
    </div>

    <!-- Section Title Card -->
    <div class="section-title-wrapper">
      <div class="section-title" id="class-title">Low Class Warrior</div>
    </div>

    <!-- Stat Card -->
    <div class="stat-card">
      <div class="stat-main-container">
        <div class="stat-black-container">
          <div class="sub-avatar"><img id="stat-role-icon" src="https://enka.network/ui/zzz/IconRoleCircle44.png" alt="Character"></div>
          <div class="stat-badge-icon"><img id="stat-weapon-icon" src="https://enka.network/ui/zzz/Weapon_S_1371.png" alt="W-Engine"></div>
        </div>
        <div class="stat-info">
          <div class="stat-label" id="stat-label">Solo Burst</div>
          <div class="stat-value" id="stat-value">Top 65.5%</div>
          <div class="stat-subvalue" id="stat-subvalue">13204 / 20.2k</div>
        </div>
      </div>
    </div>

    <!-- Leaderboard Button -->
    <button class="leaderboard-btn">Leaderboards</button>

    <!-- Filter -->
    <div class="filter-box">
      <span>Filter by...</span>
      <select id="filter-select">
        <option value="all">All Characters</option>
        <option value="m1">Mindscape &gt;= 1</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-container">
      <div class="table-content">
        <div class="table-header">
          <span>#</span>
          <span>Name</span>
          <span>Mindscape</span>
          <span>Crit Ratio</span>
        </div>
        <div id="leaderboard-rows"></div>
      </div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-controls">
      <div class="pagination-nav">
        <button class="page-btn" id="prev-page-btn">Prev</button>
        <select class="per-page-select" id="page-select"></select>
        <button class="page-btn" id="next-page-btn">Next</button>
      </div>
      <span class="showing-text" id="showing-text">Showing 0 of 0</span>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-powered">Powered by <span id="footer-brand">ZzzJaw</span></div>
    <div class="footer-subtitle" id="footer-subtitle">Penampil data akun ZZZ</div>
  </div>

  <script>
    let currentPage = 1;
    const itemsPerPage = 5;
    let currentFilteredList = [];

    // URL Param Extractor
    function getUIDFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('uid') || '1314841424'; // Default ke ID user jika kosong
    }

    // Fetch ZZZ Data from Enka.network
    async function fetchEnkaData(uid) {
      const overlay = document.getElementById("status-overlay");
      const content = document.getElementById("profile-content");
      const statusMsg = document.getElementById("status-message");
      const spinner = document.getElementById("status-spinner");

      overlay.style.display = "flex";
      content.style.display = "none";
      statusMsg.style.color = "#ccff00";
      statusMsg.textContent = `Mengambil data Enka ZZZ (UID: ${uid})...`;

      const targetUrl = `https://enka.network/api/zzz/uid/${uid}`;
      const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

      try {
        let response = await fetch(targetUrl);
        if (!response.ok) {
          // Fallback ke proxy jika terkena CORS
          response = await fetch(proxyUrl);
        }

        if (!response.ok) throw new Error("Gagal terhubung ke API Enka ZZZ.");

        const data = await response.json();
        processEnkaResponse(uid, data);

        overlay.style.display = "none";
        content.style.display = "block";
      } catch (error) {
        console.warn("Fetch langsung gagal, mencoba fallback data mock...", error);
        // Fallback Mock Parser jika API mengalami error / UID terbatas
        renderFallbackProfile(uid);
        overlay.style.display = "none";
        content.style.display = "block";
      }
    }

    function processEnkaResponse(uid, data) {
      const playerInfo = data.playerInfo || {};
      
      const profileData = {
        appName: "ZzzJaw",
        lastUpdated: "Last updated just now",
        profile: {
          name: playerInfo.nickname || `Proxy_${uid.slice(-4)}`,
          avatarUrl: playerInfo.headIcon ? `https://enka.network/ui/zzz/${playerInfo.headIcon}.png` : "https://enka.network/ui/zzz/IconInterKnotRole0062.png",
          server: uid.startsWith('1') ? "ASIA" : "GLOBAL",
          ilLevel: `IL ${playerInfo.level || 60}`,
          tag: `UID: ${uid}`,
          classTitle: "Low Class Warrior",
          shiyuScore: playerInfo.shiyuFloor || 5,
          assaultScore: playerInfo.assaultFloor || 8,
          hardcoreScore: playerInfo.maxScore || 2506
        },
        statCard: {
          roleIcon: "https://enka.network/ui/zzz/IconRoleCircle44.png",
          weaponIcon: "https://enka.network/ui/zzz/Weapon_S_1371.png",
          label: "Solo Burst",
          value: "Top 65.5%",
          subvalue: "13204 / 20.2k"
        },
        leaderboard: parseAvatarList(data.avatarInfoList || [])
      };

      renderProfile(profileData);
      currentFilteredList = profileData.leaderboard;
      renderLeaderboard();
    }

    function parseAvatarList(avatarList) {
      if (!avatarList || avatarList.length === 0) {
        return [
          { id: 1, name: "Ye Shunguang", level: 60, mindscape: 0, critRate: 50.6, critDmg: 224.4, icon: "https://enka.network/ui/zzz/IconRoleCircle55.png" },
          { id: 2, name: "Yixuan", level: 60, mindscape: 1, critRate: 48.2, critDmg: 176.4, icon: "https://enka.network/ui/zzz/IconRoleCircle44.png" },
          { id: 3, name: "Dialyn", level: 60, mindscape: 0, critRate: 85.0, critDmg: 83.6, icon: "https://enka.network/ui/zzz/IconRoleCircle54.png" }
        ];
      }

      return avatarList.map((avatar, idx) => ({
        id: idx + 1,
        name: avatar.name || `Agent ${avatar.avatarId}`,
        level: avatar.level || 60,
        mindscape: avatar.rank || 0,
        critRate: avatar.stats?.critRate ? (avatar.stats.critRate * 100) : 50.0,
        critDmg: avatar.stats?.critDmg ? (avatar.stats.critDmg * 100) : 150.0,
        icon: avatar.icon ? `https://enka.network/ui/zzz/${avatar.icon}.png` : "https://enka.network/ui/zzz/IconRoleCircle44.png"
      }));
    }

    function renderFallbackProfile(uid) {
      const fallbackData = {
        appName: "ZzzJaw",
        lastUpdated: "Last updated just now",
        profile: {
          name: `Proxy_${uid}`,
          avatarUrl: "https://enka.network/ui/zzz/IconInterKnotRole0062.png",
          server: "ASIA",
          ilLevel: "IL 60",
          tag: `UID: ${uid}`,
          classTitle: "Low Class Warrior",
          shiyuScore: 5,
          assaultScore: 8,
          hardcoreScore: 2506
        },
        statCard: {
          roleIcon: "https://enka.network/ui/zzz/IconRoleCircle44.png",
          weaponIcon: "https://enka.network/ui/zzz/Weapon_S_1371.png",
          label: "Solo Burst",
          value: "Top 65.5%",
          subvalue: "13204 / 20.2k"
        },
        leaderboard: [
          { id: 1, name: "Ye Shunguang", level: 60, mindscape: 0, critRate: 50.6, critDmg: 224.4, icon: "https://enka.network/ui/zzz/IconRoleCircle55.png" },
          { id: 2, name: "Yixuan", level: 60, mindscape: 1, critRate: 48.2, critDmg: 176.4, icon: "https://enka.network/ui/zzz/IconRoleCircle44.png" },
          { id: 3, name: "Dialyn", level: 60, mindscape: 0, critRate: 85.0, critDmg: 83.6, icon: "https://enka.network/ui/zzz/IconRoleCircle54.png" }
        ],
        footer: {
          brand: "ZzzJaw",
          subtitle: "Penampil data akun ZZZ"
        }
      };

      renderProfile(fallbackData);
      currentFilteredList = fallbackData.leaderboard;
      renderLeaderboard();
    }

    function renderProfile(data) {
      document.getElementById("app-logo").textContent = data.appName;
      document.getElementById("last-updated").textContent = data.lastUpdated;
      document.getElementById("profile-avatar").src = data.profile.avatarUrl;
      document.getElementById("profile-name").textContent = data.profile.name;
      document.getElementById("badge-server").textContent = data.profile.server;
      document.getElementById("badge-il").textContent = data.profile.ilLevel;
      document.getElementById("profile-tag").textContent = data.profile.tag;
      document.getElementById("badge-icons-row").innerHTML = `
        <div class="stat-icon-card">
          <img src="https://enka.network/ui/zzz/Shiyu02.png" alt="Shiyu">
          <div class="stat-icon-box">${data.profile.shiyuScore}</div>
        </div>
        <div class="stat-icon-card">
          <img src="https://enka.network/ui/zzz/Assault01.png" alt="Assault">
          <div class="stat-icon-box">${data.profile.assaultScore}</div>
        </div>
        <div class="stat-icon-card">
          <img src="https://enka.network/ui/zzz/HardCoreBoss_Norano_02.png" alt="Hardcore">
          <div class="stat-icon-box">${data.profile.hardcoreScore}</div>
        </div>
      `;
      document.getElementById("class-title").textContent = data.profile.classTitle;
      document.getElementById("stat-role-icon").src = data.statCard.roleIcon;
      document.getElementById("stat-weapon-icon").src = data.statCard.weaponIcon;
      document.getElementById("stat-label").textContent = data.statCard.label;
      document.getElementById("stat-value").textContent = data.statCard.value;
      document.getElementById("stat-subvalue").textContent = data.statCard.subvalue;
    }

    function renderLeaderboard() {
      const container = document.getElementById("leaderboard-rows");
      container.innerHTML = "";

      const totalItems = currentFilteredList.length;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const paginatedItems = currentFilteredList.slice(startIndex, endIndex);

      paginatedItems.forEach((item, index) => {
        const globalRank = startIndex + index + 1;
        const mindscapeClass = item.mindscape > 0 ? "mindscape-1" : "mindscape-0";

        const row = document.createElement("div");
        row.className = "table-row";
        row.innerHTML = `
          <span class="row-number">${globalRank}</span>
          <div class="player-cell">
            <div class="player-mini-avatar">
              <img src="${item.icon}" alt="${item.name}">
            </div>
            <span class="level-badge">Lv. ${item.level}</span>
            <span class="player-name">${item.name}</span>
          </div>
          <div class="mindscape-badge ${mindscapeClass}">${item.mindscape}</div>
          <div class="crit-ratio-cell">
            <div class="crit-item"><span class="crit-icon">⚙️</span> ${item.critRate.toFixed(1)}</div>
            <div class="crit-item"><span class="crit-icon">💥</span> ${item.critDmg.toFixed(1)}</div>
          </div>
        `;
        container.appendChild(row);
      });

      updatePaginationControls(totalPages);
    }

    function updatePaginationControls(totalPages) {
      const pageSelect = document.getElementById("page-select");
      pageSelect.innerHTML = "";

      for (let i = 1; i <= totalPages; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i}/${totalPages}`;
        if (i === currentPage) opt.selected = true;
        pageSelect.appendChild(opt);
      }

      document.getElementById("prev-page-btn").disabled = (currentPage <= 1);
      document.getElementById("next-page-btn").disabled = (currentPage >= totalPages);

      document.getElementById("showing-text").textContent = `Showing page ${currentPage} of ${totalPages}`;
    }

    // Event Listeners
    document.getElementById("prev-page-btn").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--;
        renderLeaderboard();
      }
    });

    document.getElementById("next-page-btn").addEventListener("click", () => {
      const totalPages = Math.ceil(currentFilteredList.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        renderLeaderboard();
      }
    });

    document.getElementById("page-select").addEventListener("change", (e) => {
      currentPage = parseInt(e.target.value);
      renderLeaderboard();
    });

    document.getElementById("filter-select").addEventListener("change", (e) => {
      const filterValue = e.target.value;
      if (filterValue === "m1") {
        currentFilteredList = currentFilteredList.filter(item => item.mindscape >= 1);
      } else {
        const uid = getUIDFromURL();
        fetchEnkaData(uid);
        return;
      }
      currentPage = 1;
      renderLeaderboard();
    });

    document.getElementById("btn-update").addEventListener("click", () => {
      const uid = getUIDFromURL();
      fetchEnkaData(uid);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const uid = getUIDFromURL();
      fetchEnkaData(uid);
    });
  </script>
</body>
</html>
